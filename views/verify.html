<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatYouSay — Confirm login</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">📱 WhatYouSay</div>
      <div class="login-sub">Confirm your login</div>
      {{NOTICE}}
      <p style="margin:0 0 20px;font-size:15px">Log in as <strong id="verify-email">{{EMAIL}}</strong>?</p>
      <form method="POST" action="/auth/verify">
        <input type="hidden" name="token" value="{{TOKEN}}">
        <button class="btn btn-primary" id="confirm-btn" type="submit" style="width:100%">Log in</button>
      </form>
      <p style="margin-top:16px;font-size:12px;color:var(--text-dim)">
        Not you? <a href="/login">Cancel</a> — nothing happens until you press Log in.
      </p>
    </div>
  </div>
</body>
</html>
